; Anifight -- default configuration.
;
; This is a normal MUGEN mugen.cfg. The game coordinate space and the motif
; pointer below are the two entries the engine actually needs; everything else
; is either honoured by the Android layer or not applicable.

[Config]
; The "game coordinate space": every motif, character and stage is translated
; into this space at load time. 320x240 is what the screenpack below is authored
; for.
GameWidth = 320
GameHeight = 240

; Logic ticks per second. MUGEN's native rate.
GameSpeed = 60

[Options]
; Which screenpack to load, relative to the game folder.
motif = data/system.def

[Video]
; --- Anifight extension, not part of the MUGEN format ---
;
; Classic MUGEN stretches its screenpack across whatever display it is given,
; which is why MUGEN on a widescreen monitor looks horizontally squashed. On a
; phone that is much worse, so we letterbox instead.
;
;   fit     - uniform scale, black bars on the short sides  (default)
;   stretch - classic MUGEN behaviour
aspect = fit

[Sound]
Sound = 0

[Debug]
; The stage the engine test entry drops you into.
StartStage = stages/training.def
